openapi: 3.0.3
info:
  title: Gold Shop API
  description: |
    Backend API for a Gold Shop Management System (Go + Gin + MongoDB + Redis).

    **Auth flow:** Obtain JWT from external `um-api` → send as `Authorization: Bearer <token>` → middleware validates JWT, resolves Redis session, resolves employee branch/role.

    **Roles:** `ADMIN` (full access) | `MANAGER` (prices, products, reports) | `STAFF` (sales, pawns, savings — default for unregistered employees)
  version: "2.0.0"

servers:
  - url: http://localhost:8080

security:
  - BearerAuth: []

tags:
  - name: Health
  - name: Branches
  - name: Employees
  - name: Gold Prices
  - name: Sales
  - name: Pawns
  - name: Gold Savings
  - name: Product Categories
  - name: Products
  - name: Customers
  - name: Inventory
  - name: Rewards
  - name: Expenses
  - name: Reports

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /api/gold/v1/branches:
    get:
      tags: [Branches]
      summary: List all branches
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchListResponse"
    post:
      tags: [Branches]
      summary: Create a branch — ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BranchRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/gold/v1/branches/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [Branches]
      summary: Get a branch by ID
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Branches]
      summary: Update a branch — ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BranchRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BranchResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Branches]
      summary: Delete a branch — ADMIN
      responses:
        "200":
          $ref: "#/components/responses/MessageResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/gold/v1/employees:
    get:
      tags: [Employees]
      summary: List all employees
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeListResponse"
    post:
      tags: [Employees]
      summary: Create an employee — ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateEmployeeRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/gold/v1/employees/branch/{branchId}:
    parameters:
      - name: branchId
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Employees]
      summary: List employees by branch
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeListResponse"

  /api/gold/v1/employees/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [Employees]
      summary: Get an employee by ID
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Employees]
      summary: Update an employee — ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateEmployeeRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Employees]
      summary: Delete an employee — ADMIN
      responses:
        "200":
          $ref: "#/components/responses/MessageResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/gold/v1/gold-prices/current:
    get:
      tags: [Gold Prices]
      summary: Get current gold prices
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoldPriceResponse"

  /api/gold/v1/gold-prices/history:
    get:
      tags: [Gold Prices]
      summary: Get gold price history
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoldPriceListResponse"

  /api/gold/v1/gold-prices:
    post:
      tags: [Gold Prices]
      summary: Set gold price manually — ADMIN, MANAGER
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetGoldPriceRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoldPriceResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/gold/v1/gold-prices/sync:
    post:
      tags: [Gold Prices]
      summary: Sync gold price from external API — ADMIN, MANAGER
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoldPriceResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/gold/v1/sales:
    get:
      tags: [Sales]
      summary: List sales
      parameters:
        - name: branch_id
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [completed, pending, cancelled]
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleListResponse"
    post:
      tags: [Sales]
      summary: Create a sale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSaleRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/gold/v1/sales/unpaid:
    get:
      tags: [Sales]
      summary: Get unpaid sales for the current branch
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleListResponse"

  /api/gold/v1/sales/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [Sales]
      summary: Get a sale by ID
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/gold/v1/sales/{id}/cancel:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      tags: [Sales]
      summary: Cancel a sale
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/gold/v1/sales/{id}/receipt:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [Sales]
      summary: Get sale receipt
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaleResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/gold/v1/pawns:
    get:
      tags: [Pawns]
      summary: List pawn tickets
      parameters:
        - name: branch_id
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [active, redeemed, forfeited, extended]
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PawnListResponse"
    post:
      tags: [Pawns]
      summary: Create a pawn ticket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePawnRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PawnResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/gold/v1/pawns/due-soon:
    get:
      tags: [Pawns]
      summary: Get pawns due soon
      parameters:
        - name: days
          in: query
          schema:
            type: integer
            default: 7
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PawnListResponse"

  /api/gold/v1/pawns/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [Pawns]
      summary: Get a pawn ticket by ID
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PawnResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/gold/v1/pawns/{id}/pay-interest:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      tags: [Pawns]
      summary: Record an interest payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount:
                  type: number
                  example: 1500.00
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PawnResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/gold/v1/pawns/{id}/redeem:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      tags: [Pawns]
      summary: Redeem a pawned item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [interest]
              properties:
                interest:
                  type: number
                discount:
                  type: number
                  default: 0
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PawnResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/gold/v1/pawns/{id}/extend:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      tags: [Pawns]
      summary: Extend a pawn term
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [additional_months]
              properties:
                additional_months:
                  type: integer
                  example: 1
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PawnResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/gold/v1/pawns/{id}/forfeit:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      tags: [Pawns]
      summary: Forfeit a pawned item
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PawnResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/gold/v1/gold-savings:
    get:
      tags: [Gold Savings]
      summary: List gold saving accounts
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [active, closed]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoldSavingListResponse"
    post:
      tags: [Gold Savings]
      summary: Open a new gold saving account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenGoldSavingRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoldSavingResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/gold/v1/gold-savings/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [Gold Savings]
      summary: Get a gold saving account by ID
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoldSavingResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/gold/v1/gold-savings/{id}/deposit:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      tags: [Gold Savings]
      summary: Deposit into a gold saving account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount:
                  type: number
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoldSavingResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/gold/v1/gold-savings/{id}/withdraw:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      tags: [Gold Savings]
      summary: Withdraw from a gold saving account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount:
                  type: number
                as_cash:
                  type: boolean
                  default: false
                  description: Withdraw as cash equivalent instead of physical gold
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoldSavingResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/gold/v1/gold-savings/{id}/close:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      tags: [Gold Savings]
      summary: Close a gold saving account
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoldSavingResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/gold/v1/gold-savings/{id}/statement:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [Gold Savings]
      summary: Get account statement (transaction history)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GoldSavingResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/gold/v1/product-categories:
    get:
      tags: [Product Categories]
      summary: List product categories
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductCategoryListResponse"
    post:
      tags: [Product Categories]
      summary: Create a product category — ADMIN, MANAGER
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductCategoryRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductCategoryResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/gold/v1/products:
    get:
      tags: [Products]
      summary: List products
      parameters:
        - name: branch_id
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [available, sold, reserved, pawned]
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductListResponse"
    post:
      tags: [Products]
      summary: Create a product — ADMIN, MANAGER
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/gold/v1/products/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [Products]
      summary: Get a product by ID
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Products]
      summary: Update a product — ADMIN, MANAGER
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Products]
      summary: Delete a product — ADMIN, MANAGER
      responses:
        "200":
          $ref: "#/components/responses/MessageResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/gold/v1/customers:
    get:
      tags: [Customers]
      summary: List customers
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerListResponse"
    post:
      tags: [Customers]
      summary: Create a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/gold/v1/customers/rfid/{rfid}:
    parameters:
      - name: rfid
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Customers]
      summary: Get a customer by RFID card
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/gold/v1/customers/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [Customers]
      summary: Get a customer by ID
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Customers]
      summary: Update a customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerResponse"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Customers]
      summary: Delete a customer — ADMIN, MANAGER
      responses:
        "200":
          $ref: "#/components/responses/MessageResponse"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/gold/v1/inventory/transfers:
    get:
      tags: [Inventory]
      summary: List inventory transfers
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, in_transit, received, cancelled]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryTransferListResponse"
    post:
      tags: [Inventory]
      summary: Create an inventory transfer request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateInventoryTransferRequest"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryTransferResponse"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/gold/v1/inventory/transfers/{id}:
    parameters:
      - $ref: "#/components/parameters/ID"
    get:
      tags: [Inventory]
      summary: Get an inventory transfer by ID
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryTransferResponse"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/gold/v1/inventory/transfers/{id}/approve:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      tags: [Inventory]
      summary: Approve an inventory transfer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventoryTransferResponse"

  /api/gold/v1/inventory/transfers/{id}/receive:
    parameters:
      - $ref: "#/components/parameters/ID"
    post:
      tags: [Inventory]
      summary: Mark an inventory transfer as received
      responses:
        "200":
          description: OK
          content:
            application/json:
