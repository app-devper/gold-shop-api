components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ID:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: MongoDB ObjectID

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Unauthorized — missing or invalid JWT
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Forbidden — insufficient role
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    MessageResponse:
      description: OK with message
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MessageResponse"

  schemas:
    # ── Common ──────────────────────────────────────────────────────────────
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: resource not found

    MessageResponse:
      type: object
      properties:
        message:
          type: string
          example: deleted successfully

    GenericDataResponse:
      type: object
      properties:
        data:
          type: object

    # ── Branch ───────────────────────────────────────────────────────────────
    Branch:
      type: object
      properties:
        id:
          type: string
          example: 64a1b2c3d4e5f6a7b8c9d0e1
        code:
          type: string
          example: HQ
        name:
          type: string
          example: Head Quarter
        address:
          type: string
        phone:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    BranchRequest:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          example: HQ
        name:
          type: string
          example: Head Quarter
        address:
          type: string
        phone:
          type: string

    BranchResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/Branch"

    BranchListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Branch"

    # ── Employee ─────────────────────────────────────────────────────────────
    Employee:
      type: object
      properties:
        id:
          type: string
        branchId:
          type: string
        userId:
          type: string
        role:
          type: string
          enum: [ADMIN, MANAGER, STAFF]
        createdBy:
          type: string
        createdDate:
          type: string
          format: date-time
        updatedBy:
          type: string
        updatedDate:
          type: string
          format: date-time

    CreateEmployeeRequest:
      type: object
      required: [branchId, userId, role]
      properties:
        branchId:
          type: string
        userId:
          type: string
        role:
          type: string
          enum: [ADMIN, MANAGER, STAFF]

    UpdateEmployeeRequest:
      type: object
      properties:
        branchId:
          type: string
        role:
          type: string
          enum: [ADMIN, MANAGER, STAFF]

    EmployeeResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/Employee"

    EmployeeListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Employee"

    # ── Gold Price ────────────────────────────────────────────────────────────
    GoldPrice:
      type: object
      properties:
        id:
          type: string
        date:
          type: string
          format: date-time
        gold_bar_buy:
          type: number
          example: 32500.00
        gold_bar_sell:
          type: number
          example: 32600.00
        gold_ornament_buy:
          type: number
          example: 31900.00
        gold_ornament_sell:
          type: number
          example: 33100.00
        source:
          type: string
          example: api
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time

    SetGoldPriceRequest:
      type: object
      required: [gold_bar_buy, gold_bar_sell, gold_ornament_buy, gold_ornament_sell]
      properties:
        gold_bar_buy:
          type: number
        gold_bar_sell:
          type: number
        gold_ornament_buy:
          type: number
        gold_ornament_sell:
          type: number

    GoldPriceResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/GoldPrice"

    GoldPriceListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/GoldPrice"

    # ── Sale ─────────────────────────────────────────────────────────────────
    SaleItem:
      type: object
      properties:
        product_id:
          type: string
        product_item_id:
          type: string
        product_name:
          type: string
        gold_type:
          type: string
        weight:
          type: number
        price_level:
          type: string
        unit_price:
          type: number
        labor_cost:
          type: number
        discount:
          type: number
        discount_type:
          type: string
          enum: [amount, percent]
        cost:
          type: number
        total:
          type: number

    OldGoldItem:
      type: object
      description: |
        Customer-supplied gold being traded in. Used in sales of type `buy_old`
        or `exchange`. Routing of the physical gold after the sale is captured
        at the parent `Sale.old_item_destination`, not per-item.
      properties:
        description:
          type: string
        gold_type:
          type: string
          example: 96.5%
        kind:
          type: string
          enum: [ornament, bar]
          description: Form of the traded-in gold.
        condition:
          type: string
          enum: [good, fair, damaged]
          description: |
            Physical state recorded by the shop (SRS 3.7). Audit metadata only —
            does not affect price math; price is `weight × price_per_unit × (1 − deduction_percent/100)`.
            - `good` — สภาพดี
            - `fair` — พอใช้
            - `damaged` — ชำรุด
        weight:
          type: number
          description: Weight in grams.
        price_per_unit:
          type: number
          description: Buyback price per gram (baht).
        gross_total:
          type: number
          description: "`weight × price_per_unit` before deduction."
        deduction_percent:
          type: number
          description: Percent deducted by the shop from `gross_total`.
        deduction_amount:
          type: number
          description: "`gross_total × deduction_percent / 100`."
        total:
          type: number
          description: "`gross_total − deduction_amount`. Net buyback."

    Payment:
      type: object
      properties:
        method:
          type: string
          enum: [cash, credit_card, transfer, voucher]
        amount:
          type: number
        reference:
          type: string

    Sale:
      type: object
      properties:
        id:
          type: string
        branch_id:
          type: string
        sale_number:
          type: string
          description: |
            Auto-generated reference (SRS 6.2). Format: `<prefix>{YYMMDD}{XXXX}`.
            Prefix encodes `sale_type`:
            - `S` — sell
            - `B` — buy_old
            - `TR` — exchange
            `XXXX` is a per-day, per-prefix, per-branch atomic counter.
          example: S2605040001
        customer_id:
          type: string
        user_id:
          type: string
        sale_type:
          type: string
          enum: [sell, buy_old, exchange]
        items:
          type: array
          items:
            $ref: "#/components/schemas/SaleItem"
        old_gold_items:
          type: array
          items:
            $ref: "#/components/schemas/OldGoldItem"
        old_item_destination:
          type: string
          enum: [melt, resell, scrap]
          description: |
            Where the customer-traded-in gold goes after the sale (SRS 3.7).
            Set on `buy_old` / `exchange`; omitted for `sell`. Audit field — does
            not affect price math.
            - `melt` — ส่งหลอม
            - `resell` — เข้าสต็อกขายต่อ
            - `scrap` — เก็บเป็นเศษ
        subtotal:
          type: number
        discount:
          type: number
        discount_type:
          type: string
          enum: [amount, percent]
        old_gold_value:
          type: number
        net_total:
          type: number
        payments:
          type: array
          items:
            $ref: "#/components/schemas/Payment"
        points_earned:
          type: integer
        points_used:
          type: integer
        status:
          type: string
          enum: [completed, pending, cancelled]
        notes:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateSaleRequest:
      type: object
      required: [sale_type, items, payments]
      properties:
        customer_id:
          type: string
        sale_type:
          type: string
          enum: [sell, buy_old, exchange]
        items:
          type: array
          items:
            $ref: "#/components/schemas/SaleItem"
        old_gold_items:
          type: array
          items:
            $ref: "#/components/schemas/OldGoldItem"
        old_item_destination:
          type: string
          enum: [melt, resell, scrap]
          description: Destination for traded-in gold. Required when `sale_type` is `buy_old` or `exchange`.
        discount:
          type: number
          default: 0
        discount_type:
          type: string
          enum: [amount, percent]
          default: amount
        payments:
          type: array
          items:
            $ref: "#/components/schemas/Payment"
        points_used:
          type: integer
          default: 0
        notes:
          type: string

    SaleResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/Sale"

    SaleListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Sale"

    # ── Pawn ─────────────────────────────────────────────────────────────────
    PawnItem:
      type: object
      properties:
        description:
          type: string
        gold_type:
          type: string
        weight:
          type: number
        appraised_value:
          type: number
        images:
          type: array
          items:
            type: string

    Pawn:
      type: object
      properties:
        id:
          type: string
        branch_id:
          type: string
        pawn_number:
          type: string
        customer_id:
          type: string
        user_id:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/PawnItem"
        principal:
          type: number
        interest_rate:
          type: number
        term_months:
          type: integer
        start_date:
          type: string
          format: date-time
        due_date:
          type: string
          format: date-time
        status:
          type: string
          enum: [active, redeemed, forfeited, extended]
        notes:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreatePawnRequest:
      type: object
      required: [customer_id, items, principal, interest_rate, term_months]
      properties:
        customer_id:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/PawnItem"
        principal:
          type: number
        interest_rate:
          type: number
        term_months:
          type: integer
        notes:
          type: string

    PawnResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/Pawn"

    PawnListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Pawn"

    # ── Gold Saving ───────────────────────────────────────────────────────────
    GoldSavingTransaction:
      type: object
      properties:
        date:
          type: string
          format: date-time
        type:
          type: string
          enum: [deposit, withdrawal]
        amount:
          type: number
        gold_price:
          type: number
        gold_weight:
          type: number
        balance_after:
          type: number

    GoldSaving:
      type: object
      properties:
        id:
          type: string
        branch_id:
          type: string
        account_number:
          type: string
        customer_id:
          type: string
        saving_type:
          type: string
          enum: [money, weight]
        min_deposit:
          type: number
        min_withdrawal:
          type: number
        gold_balance:
          type: number
        cash_balance:
          type: number
        transactions:
          type: array
          items:
            $ref: "#/components/schemas/GoldSavingTransaction"
        status:
          type: string
          enum: [active, closed]
        opened_date:
          type: string
          format: date-time
        closed_date:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    OpenGoldSavingRequest:
      type: object
      required: [customer_id, saving_type]
      properties:
        customer_id:
          type: string
        saving_type:
          type: string
          enum: [money, weight]
        min_deposit:
          type: number
          default: 0
        min_withdrawal:
          type: number
          default: 0

    GoldSavingResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/GoldSaving"

    GoldSavingListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/GoldSaving"

    # ── Product Category ──────────────────────────────────────────────────────
    ProductCategory:
      type: object
      properties:
        id:
          type: string
        code:
          type: string
        name:
          type: string
        description:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time

    ProductCategoryRequest:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
        name:
          type: string
        description:
          type: string

    ProductCategoryResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/ProductCategory"

    ProductCategoryListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/ProductCategory"

    # ── Product ───────────────────────────────────────────────────────────────
    Product:
      type: object
      properties:
        id:
          type: string
        branch_id:
          type: string
        category_id:
          type: string
          description: |
            Deprecated. Reference to a master `ProductCategory` document.
            Prefer the inline `category` enum below for ornament products.
        category:
          type: string
          enum: [necklace, bracelet, ring, bangle, earring, pendant, amulet]
          description: |
            Ornament-only sub-category (SRS 3.2). Omit for `kind=bar`.
            - `necklace` — สร้อยคอ
            - `bracelet` — สร้อยข้อมือ
            - `ring` — แหวน
            - `bangle` — กำไล
            - `earring` — ต่างหู
            - `pendant` — จี้
            - `amulet` — เลี่ยมพระ
        sku:
          type: string
        barcode:
          type: string
        name:
          type: string
        description:
          type: string
        note:
          type: string
          description: Internal note for shop staff (separate from `description`, which is customer-facing).
        stock_type:
          type: string
          enum: [piece, weight]
        gold_type:
          type: string
          example: 96.5%
        weight:
          type: number
        weight_unit:
          type: string
          example: gram
        labor_cost:
          type: number
        price:
          type: number
        cost:
          type: number
        status:
          type: string
          enum: [available, sold, reserved, pawned]
        images:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time

    ProductRequest:
      type: object
      required: [category_id, sku, name, gold_type, stock_type, weight, labor_cost]
      properties:
        category_id:
          type: string
        category:
          type: string
          enum: [necklace, bracelet, ring, bangle, earring, pendant, amulet]
          description: Ornament sub-category (SRS 3.2). Omit for bar products.
        sku:
          type: string
        barcode:
          type: string
        name:
          type: string
        description:
          type: string
        note:
          type: string
          description: Internal note (separate from customer-facing `description`).
        stock_type:
          type: string
          enum: [piece, weight]
        gold_type:
          type: string
        weight:
          type: number
        labor_cost:
          type: number

    ProductResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/Product"

    ProductListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Product"

    # ── Customer ──────────────────────────────────────────────────────────────
    Membership:
      type: object
      properties:
        tier:
          type: string
          enum: [bronze, silver, gold, platinum]
        points:
          type: integer
        join_date:
          type: string
          format: date-time

    Customer:
      type: object
      properties:
        id:
          type: string
        member_code:
          type: string
        rfid_card:
          type: string
        full_name:
          type: string
        id_card:
          type: string
        phone:
          type: string
        email:
          type: string
        address:
          type: string
        is_member:
          type: boolean
        membership:
          $ref: "#/components/schemas/Membership"
        total_spent:
          type: number
        created_at:
          type: string
          format: date-time

    CustomerRequest:
      type: object
      required: [full_name, phone]
      properties:
        full_name:
          type: string
        phone:
          type: string
        email:
          type: string
        address:
          type: string
        id_card:
